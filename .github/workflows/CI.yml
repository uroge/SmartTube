name: Secure build
on:
  push:
    branches: [master, security/**]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Set up Android SDK and pinned packages
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-34 build-tools;30.0.3'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - run: python3 security/check-source.py
      - name: Tests, lint and all application flavors
        run: ./gradlew --no-daemon -Pkotlin.compiler.execution.strategy=in-process :smarttubetv:testStbetaDebugUnitTest :common:testStbetaDebugUnitTest :sharedutils:testDebugUnitTest :appupdatechecker2:testStbetaDebugUnitTest :sharedutils:assembleDebugAndroidTest :smarttubetv:lintStbetaRelease :smarttubetv:lintStstableRelease :smarttubetv:lintStfdroidRelease :smarttubetv:assembleStbetaRelease :smarttubetv:assembleStstableRelease :smarttubetv:assembleStfdroidRelease
      - name: Inspect unsigned release APKs
        run: |
          find smarttubetv/build/outputs/apk -name '*.apk' -print0 | while IFS= read -r -d '' apk; do python3 security/inspect-apk.py "$apk"; done
      - name: Resolve production dependency inventory
        run: ./gradlew :smarttubetv:dependencies --configuration stbetaReleaseRuntimeClasspath > dependency-tree.txt
      - name: Audit dependencies
        run: python3 security/dependency-audit.py dependency-tree.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: security-build-results
          path: |
            **/build/reports/
            dependency-tree.txt
            dependency-audit.json
            smarttubetv/build/outputs/apk/
            SharedModules/sharedutils/build/outputs/apk/androidTest/
