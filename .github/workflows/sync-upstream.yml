name: Review upstream changes
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: upstream-review
  cancel-in-progress: false
jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - name: Prepare reviewed sync branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch https://github.com/yuliskov/SmartTube.git master
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then exit 0; fi
          git switch -c upstream-review
          git merge --no-commit --no-ff FETCH_HEAD
          # Always preserve the reviewed module graph and dependency origins.
          git restore --source=origin/master --staged --worktree -- .gitmodules SharedModules MediaServiceCore
          git commit -m 'Propose upstream SmartTube changes for security review'
          git push --force-with-lease origin HEAD:upstream-review
          if ! gh pr view upstream-review >/dev/null 2>&1; then
            gh pr create --base master --head upstream-review --title 'Review upstream SmartTube changes' --body 'Review security-sensitive changes and run Secure build manually. No automatic merge or release. Pinned submodules remain unchanged.'
          fi
