name: Verified signed release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name, for example 32.69.1'
        required: true
permissions:
  contents: read
concurrency:
  group: signed-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Require reviewed source and observed device checks
        env:
          APPROVED_SHA: ${{ vars.DEVICE_CHECKS_APPROVED_SHA }}
        run: |
          test "$GITHUB_REPOSITORY" = 'uroge/SmartTube'
          test "$APPROVED_SHA" = "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD origin/master
          git submodule status --recursive | python3 -c 'import sys; lines=sys.stdin.readlines(); assert all(x.startswith(" ") for x in lines), "Dirty or uninitialized module graph"'
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Set up Android SDK and pinned packages
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-34 build-tools;30.0.3'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: Select monotonically increasing version in CI
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          NAME="${REQUESTED:-${GITHUB_REF_NAME#v}}"
          [[ "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          CODE=$(python3 -c 'import re; print(int(re.search(r"versionCode (\d+)",open("smarttubetv/build.gradle").read())[1])*100)')
          for flavor in beta stable; do
            status=$(curl --silent --show-error --location --output "$RUNNER_TEMP/$flavor.json" --write-out '%{http_code}' "https://github.com/uroge/SmartTube/releases/download/latest/smarttube_${flavor}2.json")
            if [ "$status" = 200 ]; then
              published=$(jq '[.[] | .versionCode? // empty] | max // 0' "$RUNNER_TEMP/$flavor.json")
              if [ "$published" -ge "$CODE" ]; then CODE=$((published+1)); fi
            elif [ "$status" != 404 ]; then exit 1; fi
          done
          python3 - "$NAME" "$CODE" <<'PY'
          import re,sys
          from pathlib import Path
          p=Path('smarttubetv/build.gradle');s=p.read_text()
          s=re.sub(r'versionCode \d+', 'versionCode '+sys.argv[2],s,count=1)
          s=re.sub(r'versionName "[^"]+"','versionName "'+sys.argv[1]+'"',s,count=1)
          p.write_text(s)
          PY
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
      - name: Check source, tests and lint before signing
        run: |
          python3 security/check-source.py
          ./gradlew --no-daemon -Pkotlin.compiler.execution.strategy=in-process :smarttubetv:testStbetaDebugUnitTest :common:testStbetaDebugUnitTest :sharedutils:testDebugUnitTest :appupdatechecker2:testStbetaDebugUnitTest :smarttubetv:lintStbetaRelease :smarttubetv:lintStstableRelease :smarttubetv:lintStfdroidRelease
          ./gradlew :smarttubetv:dependencies --configuration stbetaReleaseRuntimeClasspath > dependency-tree.txt
          python3 security/dependency-audit.py dependency-tree.txt
      - name: Configure release signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_KEY"
          umask 077
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/key.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$RUNNER_TEMP/key.jks" "$KEY_STORE_PASSWORD" "$ALIAS" "$KEY_PASSWORD" > keystore.properties
      - name: Build and verify every flavor
        run: |
          ./gradlew --no-daemon :smarttubetv:assembleStbetaRelease :smarttubetv:assembleStstableRelease :smarttubetv:assembleStfdroidRelease
          find smarttubetv/build/outputs/apk -name '*.apk' -print0 | while IFS= read -r -d '' apk; do python3 security/inspect-apk.py --signed "$apk"; done
          python3 security/prepare-release.py --name '${{ steps.version.outputs.name }}' --code '${{ steps.version.outputs.code }}'
          "$ANDROID_HOME/build-tools/30.0.3/apksigner" verify --print-certs dist/smarttube_beta_arm64-v8a.apk > dist/signing-certificate.txt
      - name: Publish immutable release before rolling feed
        env:
          NAME: ${{ steps.version.outputs.name }}
        run: |
          gh release create "v$NAME" dist/* --target "$GITHUB_SHA" --title "SmartTube (uroge) $NAME" --notes 'Reviewed security-maintained release. See provenance.json, SHA256SUMS and signing-certificate.txt.' --latest
          # The manifest points to immutable versioned APK URLs. Publishing it last avoids partial releases.
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/smarttube_beta2.json dist/smarttube_stable2.json --clobber
          else
            gh release create latest dist/smarttube_beta2.json dist/smarttube_stable2.json --target "$GITHUB_SHA" --title 'Update manifests' --notes 'Pointers to verified immutable releases' --latest=false
          fi
      - name: Remove temporary signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/key.jks"
